async function gemModels(key,fb){if(fb)return GMODELS;if(gList&&gList.t>Date.now()-864e5)return [...new Set([...gList.m,...GMODELS])];
  try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':String(key||'').replace(/[^A-Za-z0-9._\-]/g,'')}});if(r.ok){const j=await r.json();
    const v=n=>{const m=n.match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
    const ms=(j.models||[]).filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace(/^models\//,'')).filter(n=>/flash/.test(n)&&!/image|tts|audio|live|embed|thinking|exp/.test(n));
    ms.sort((a,b)=>(/preview/.test(a)-/preview/.test(b))||(v(b)-v(a))||(/lite/.test(b)-/lite/.test(a)));
    if(ms.length){gList={t:Date.now(),m:ms.slice(0,6)};lsSet('contas-gmodels',gList)}}}catch(e){}
  return [...new Set([...(gList?gList.m:[]),...GMODELS])]}
async function gemCall(key,parts,json,fb){let last='upstream_error';const tag=fb?'fb':'k';const all=await gemModels(key,fb);const order=gModel[tag]?[gModel[tag],...all.filter(x=>x!==gModel[tag])]:[...all];const extra=order;
  for(let i=0;i<order.length&&i<12;i++){const m=order[i];let r;
    const url=fb?'https://firebasevertexai.googleapis.com/v1beta/projects/'+firebaseConfig.projectId+'/models/'+m+':generateContent'
               :'https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent';
    const h={'content-type':'application/json','x-goog-api-key':String(key||'').replace(/[^A-Za-z0-9._\-]/g,'')};if(fb)h['x-firebase-appid']=firebaseConfig.appId;
    const gc=json?{responseMimeType:'application/json',temperature:0}:{temperature:0};if(!noThink[m])gc.thinkingConfig={thinkingBudget:0};
    try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:gc})})}catch(e){gErr='rede/CORS: '+(e&&e.message||e);throw {code:'upstream_error'}}
    if(r.ok){gModel[tag]=m;const j=await r.json();return ((j.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('')}
    const j=await r.json().catch(()=>({}));const msg=JSON.stringify(j);gErr=r.status+' '+m+': '+((j.error&&j.error.message)||msg).slice(0,160);
    if(r.status===400&&!/API_KEY|API key/i.test(msg)&&!noThink[m]){noThink[m]=1;return gemCall(key,parts,json,fb)}
    if(r.status===400&&!/API_KEY|API key/i.test(msg)){last='upstream_error';continue}
    {const sug=msg.match(/models\/(gemini-[a-z0-9.\-]+)/g);if(r.status===404&&sug)sug.map(x=>x.replace('models/','').replace(/[.\-]+$/,'')).filter(x=>x!==m&&!extra.includes(x)).forEach(x=>extra.push(x))}
    if(r.status>=500){if(last!=='rate_limited')last='busy';continue}
    if(r.status===429){last='rate_limited';continue}
    if(r.status===404){if(last!=='rate_limited')last='upstream_error';continue}
    if(/SERVICE_DISABLED|has not been used|is disabled|not enabled/i.test(msg))throw {code:'fb_off'};
    if(/API_KEY_INVALID|API key not valid/i.test(msg))throw {code:'bad_key'};
    if(/image|mime|inline/i.test(msg))throw {code:'image_rejected'};
    if(r.status===400&&/model/i.test(msg)){continue}
    throw {code:r.status===401||r.status===403?'bad_key':'upstream_error'}}
  throw {code:last}}

let swX=0,swY=0,swEl=null,swDx=0,swMoved=false,swOpenEl=null;

  if((o.data||'')!==(n.data||''))r.push('data '+(o.data||'?')+' → '+(n.data||'?'));
  if((o.lev||'')!==(n.lev||''))r.push(n.lev?'pago com um levantamento':'já não usa levantamento');
  if(!!o.foto!==!!n.foto)r.push(n.foto?'anexou foto':'tirou a foto');
  if((o.emoji||'')!==(n.emoji||'')&&!r.length)r.push('ícone');
  return r.join(' · ')}
var histAll=false;
function histHTML(g){const lg=g.log||[],lx=g.lixo||[];
  const now=new Date(),td=now.toDateString(),yd=new Date(now-864e5).toDateString();
  const when=t=>{const x=new Date(t),m=Math.round((now-x)/6e4),hh=x.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});return m<1?'agora':m<60?'há '+m+' min':x.toDateString()===td?'hoje '+hh:x.toDateString()===yd?'ontem '+hh:x.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})+' '+hh};
  const cls=a=>/apagou|removeu/.test(a)?'del':/criou|adicionou|recuperou/.test(a)?'add':/pagamento/.test(a)?'pay':'chg';
  const sh=histAll?lg:lg.slice(0,8);
  return `<div class="card hist"><h3 class="ppc-t">🕓 Alterações${ii('Quem criou, mudou ou apagou o quê.')}</h3>
  ${lg.length?sh.map(h=>`<div class="hi"><span class="hd ${cls(h.a)}"></span><div class="hb"><p><b>${esc(h.q)}</b> ${esc(h.a)} ${esc(h.e||'')} <b>${esc(h.ti)}</b>${h.v!=null?` · ${fmt(h.v,h.m)}`:''}</p>${h.x?`<p class="hx">${esc(h.x)}</p>`:''}<small>${esc(when(h.t))}</small></div></div>`).join(''):'<p class="small">Ainda não há alterações registadas.</p>'}
  ${lg.length>8?`<button class="linkbtn" id="histmore">${histAll?'Mostrar menos':'Ver todas ('+lg.length+')'}</button>`:''}
  ${lx.length?`<p class="small" style="margin:14px 0 6px"><b>🗑️ Apagadas · podes recuperar</b></p>${lx.slice(0,8).map(d=>`<div class="hrow"><span>${esc(dEmo(d))} ${esc(d.titulo)} · ${fmt(d.total,d.moeda)}</span><button class="linkbtn" data-restore="${esc(d.id)}">Recuperar</button></div>`).join('')}`:''}</div>`}


/* ---------- cada pessoa só pode ser escolhida por um telemóvel/conta ---------- */
let askTake=null;
const DEVK=(()=>{try{let d=localStorage.getItem('ej-dev');if(!d){d=Math.random().toString(36).slice(2,12);localStorage.setItem('ej-dev',d)}return d}catch(e){return 'x'}})();
const myKey=()=>(typeof user!=='undefined'&&user&&user.uid)||DEVK;
function takenBy(g,mid){const c=(g.claims||{})[mid];return c&&c!==myKey()?c:null}
function claim(g,mid){const k=myKey();const c={...(g.claims||{})};for(const m in c)if(c[m]===k)delete c[m];if(mid)c[mid]=k;g.claims=c;save(g)}


/* ---------- dono do grupo ---------- */
function ownerOf(g){if(g.ownerMid&&g.membros.some(p=>p.id===g.ownerMid))return g.ownerMid;const c=g.criador&&(g.claims||{});if(c){for(const m in c)if(c[m]===g.criador)return m}return g.membros[0]&&g.membros[0].id}
function canEdit(g,mid){return isOwner(g)||mid===meOf(g)}
function dupName(g,n,skip){const k=String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();return g.membros.some(p=>p.id!==skip&&String(p.nome).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()===k)}
function isOwner(g){const me=meOf(g);return !!me&&me===ownerOf(g)}

}
