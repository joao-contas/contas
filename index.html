- "total" é o valor final pago (com impostos, taxa de serviço e gorjeta, se constarem).

- "itens": cada linha de produto, com "preco" = preço total da linha (já multiplicado pela quantidade). Não incluas subtotais, impostos nem trocos como itens.
- Se a imagem for um ecrã de uma app de banco ou cartão (Revolut, Wise, N26, MB Way, extrato…) com um pagamento a um comerciante: "tipo": "banco"; "descricao" = só o nome do comerciante/local (sem "Pagamento a"); "total" e "moeda" = valor e moeda ORIGINAIS cobrados pelo comerciante (ex.: 17999 CRC); "valor_pago" e "moeda_paga" = o valor final que saiu da conta, já com comissões e impostos (ex.: "O seu total" 37.82 EUR); "itens": [] (comissões, impostos e taxas de câmbio NÃO são artigos); "emoji" de acordo com a categoria indicada. "taxa" = a taxa de câmbio mostrada no ecrã, em unidades da moeda original por 1 unidade da moeda paga (ex.: "1 € = 482,6190 ₡" → 482.619). Se não houver conversão de moeda, "valor_pago", "moeda_paga" e "taxa" ficam null.
- "emoji": um único emoji que represente a despesa (comida, supermercado, hotel, transporte…).

  ${lx.length?`<p class="small" style="margin:14px 0 6px"><b>🗑️ Apagadas · podes recuperar</b></p>${lx.slice(0,8).map(d=>`<div class="hrow"><span>${esc(dEmo(d))} ${esc(d.titulo)} · ${fmt(d.total,d.moeda)}</span><button class="linkbtn" data-restore="${esc(d.id)}">Recuperar</button></div>`).join('')}`:''}</div>`}


/* ---------- cada pessoa só pode ser escolhida por um telemóvel/conta ---------- */
let askTake=null;
const DEVK=(()=>{try{let d=localStorage.getItem('ej-dev');if(!d){d=Math.random().toString(36).slice(2,12);localStorage.setItem('ej-dev',d)}return d}catch(e){return 'x'}})();
const myKey=()=>(typeof user!=='undefined'&&user&&user.uid)||DEVK;
function takenBy(g,mid){const c=(g.claims||{})[mid];return c&&c!==myKey()?c:null}
/* garante que o grupo sabe quem és (para as regras de segurança do Firebase) */
function ensureIds(g){if(!g||typeof user==='undefined'||!user||!user.uid)return;const me=meOf(g);let ch=false;
  if(me&&(g.claims||{})[me]!==user.uid){const c={...(g.claims||{})};for(const m in c)if(c[m]===user.uid&&m!==me)delete c[m];c[me]=user.uid;g.claims=c;ch=true}
  if(isOwner(g)&&String(g.criador||'').length!==28){g.criador=user.uid;ch=true}if(ch)save(g)}
function claim(g,mid){const k=myKey();const c={...(g.claims||{})};for(const m in c)if(c[m]===k)delete c[m];if(mid)c[mid]=k;g.claims=c;save(g)}


/* ---------- dono do grupo ---------- */
function ownerOf(g){if(g.ownerMid&&g.membros.some(p=>p.id===g.ownerMid))return g.ownerMid;const c=g.criador&&(g.claims||{});if(c){for(const m in c)if(c[m]===g.criador)return m}return g.membros[0]&&g.membros[0].id}
function gLocked(g){if(!g||!g.despesas.some(d=>d.tipo!=='reemb'))return false;const c=g.claims||{};return g.membros.length>0&&g.membros.every(p=>c[p.id])}
function canEdit(g,mid){return isOwner(g)||mid===meOf(g)}
function canRen(g,mid){return isOwner(g)||(mid===meOf(g)&&!gLocked(g))}
function dupName(g,n,skip){const k=String(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();return g.membros.some(p=>p.id!==skip&&String(p.nome).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()===k)}
function isOwner(g){const me=meOf(g);return !!me&&me===ownerOf(g)}

}
