<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contas do Grupo</title>
<meta name="theme-color" content="#d8f0e2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo, minimalista, amigável
   IDEA: um caderno de contas leve, papel claro com etiquetas em tons pastel
   PICTURE: a própria app — cartões suaves, barras de saldo pastel, editor de pagadores
   COLOUR and TYPE: verde menta claro de fundo, pêssego para o que se deve, azul pastel para o que se recebe; Outfit + Inter
   LAYOUT: cabeçalho verde pastel sem moldura, uma coluna até 720px, muito ar */
:root{color-scheme:light;--bg:#f5fbf7;--card:#ffffff;--ink:#24352d;--mut:#6c8278;--line:#e2efe7;
--lav:#d8f0e2;--lavd:#2e7a57;--blue:#cfe6f7;--blued:#2f6c96;--peach:#ffe0d2;--peachd:#b4572f;--pink:#f9dbe8;
--shadow:0 1px 2px rgb(40 90 60/.05),0 6px 20px rgb(40 90 60/.07)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;line-height:1.1;margin:0;font-weight:500}
.top{background:var(--lav);padding:calc(clamp(22px,4vw,48px) + env(safe-area-inset-top)) max(5vw,18px) clamp(26px,3.5vw,40px);border-radius:0 0 28px 28px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:clamp(30px,5vw,44px);text-wrap:balance;letter-spacing:-.01em}
#sub{margin:8px 0 0;color:var(--mut)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.stat{background:rgb(255 255 255/.7);border-radius:16px;padding:10px 16px}
.stat b{display:block;font:500 clamp(22px,4vw,28px)/1.15 Outfit,sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
main{padding:24px max(5vw,18px) 64px}
button,select,input{font:inherit;font-size:16px;color:inherit}
button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--line);cursor:pointer;font-weight:500}
button:hover{filter:brightness(.98)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9dcc0;outline-offset:2px}
.primary{background:var(--lavd);color:#fff}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;color:var(--lavd);padding:0 6px;margin:-8px 0 6px -6px}
.danger{color:var(--peachd);background:var(--peach)}
input,select{min-height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#fff;width:100%}
input:disabled{background:var(--bg);color:var(--mut)}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:14px 0 4px}
label input,label select{margin-top:6px;color:var(--ink)}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.list{display:grid;gap:10px;margin:16px 0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;width:100%;padding:16px 18px;min-height:68px;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.item h3{font-size:18px}
.item h3{grid-column:2}.item small{color:var(--mut);font-size:14px;grid-column:2}
.item .ic{grid-row:1/3;grid-column:1;font-size:24px;width:46px;height:46px;display:grid;place-items:center;background:var(--lav);border-radius:15px}
.item .amt{font:500 18px Outfit,sans-serif;white-space:nowrap;grid-row:1/3;grid-column:3;text-align:right}
.tabs{display:inline-flex;gap:4px;margin:0 0 18px;background:var(--line);padding:4px;border-radius:999px;max-width:100%;overflow-x:auto}
.tabs button{background:transparent;color:var(--mut);min-height:40px;padding:0 16px;white-space:nowrap}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.bar+.bar{border-top:1px solid var(--line)}
.track{height:10px;border-radius:5px;background:var(--bg);position:relative;overflow:hidden}
.track i{position:absolute;top:0;bottom:0;border-radius:5px}
.newbtn{width:100%;margin-top:14px}
.pf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.pf .pf-t{flex:1;min-width:12em;color:var(--mut);font-size:15px}
.pf-row{width:100%;text-align:left;background:var(--card);color:var(--ink);flex-wrap:nowrap;padding:14px 18px}
.pf-row .pf-e{font-size:28px}.pf-row .pf-t{display:flex;flex-direction:column;color:var(--ink);min-width:0}.pf-row .pf-t small{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-row .pf-go{color:var(--mut);font-size:24px}
.you{margin-top:4px}.you.rec{background:#eaf4fb}.you.dev{background:#fff1ea}.you.ok{background:var(--lav)}
.you-l{margin:0;font-size:14px;color:var(--mut)}.you-big{margin:2px 0 6px;font:600 24px Outfit,sans-serif}
.you.rec .you-big{color:var(--blued)}.you.dev .you-big{color:var(--peachd)}.you.ok .you-big{color:var(--lavd)}
.pay{padding:12px 0}.pay+.pay,.you-big+.pay{border-top:1px solid rgb(0 0 0/.07)}
.pay-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.pay-who{min-width:0}
.pay-amt{font:600 20px Outfit,sans-serif;white-space:nowrap}
.pay-ctl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.pay-ctl .curbtn,.pay-ctl select{width:auto;min-width:7.5em}.pay-ctl button:not(.curbtn){flex:1;background:var(--lav);color:var(--lavd)}
.pay-ctl button.primary{background:var(--lavd);color:#fff}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}.prow+.prow{border-top:1px solid var(--line)}
.prow .pn{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow small{color:var(--mut);font-weight:400}
.pill{margin-left:auto;padding:5px 12px;border-radius:999px;font:500 15px Outfit,sans-serif;white-space:nowrap}
.pill.rec{background:var(--blue);color:var(--blued)}.pill.dev{background:var(--peach);color:var(--peachd)}.pill.ok{background:var(--lav);color:var(--lavd)}
.opts{margin:16px 0 8px}.opts summary{cursor:pointer;color:var(--mut);padding:8px 0;font-weight:500}
.pos{color:var(--blued)}.neg{color:var(--peachd)}
.num{font:500 16px Outfit,sans-serif;white-space:nowrap;text-align:right}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0}
.tr+.tr{border-top:1px solid var(--line)}
.tr .who{font-weight:600}
.tr .ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tr select{width:auto}
.tr button{background:var(--blue);color:var(--blued)}
.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
.modal{position:fixed;inset:0;background:rgb(36 53 45/.28);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:24px max(4vw,18px) 26px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:28px}}
.sheet h2{font-size:26px}
.sheet section{margin-top:18px;background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.sheet section:nth-of-type(1){border-top:4px solid var(--blue)}
.sheet section:nth-of-type(2){border-top:4px solid var(--pink)}
.sheet h3{font-size:19px;margin-bottom:2px}
.hint{color:var(--mut);font-size:14px;margin:2px 0 8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 8.5em 48px;gap:8px;align-items:center;margin:4px 0}
.chk{display:flex;align-items:center;gap:10px;margin:0;font-size:16px;color:var(--ink);font-weight:400;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--lavd)}
.prow .v{text-align:right}
.prow .calc{text-align:right;font-weight:500;white-space:nowrap}
.auto{padding:0;font-size:13px;background:var(--lav);color:var(--lavd);min-height:32px}
.pt{display:flex;gap:6px;align-items:center}
.sum{font-size:14px;font-weight:500;margin:10px 0 0;color:var(--blued)}
.sum.bad{color:var(--peachd)}
.seg{display:inline-flex;gap:4px;background:var(--line);padding:4px;border-radius:999px;margin:6px 0 8px}
.seg button{background:transparent;min-height:36px;color:var(--mut)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
.actions .danger{margin-right:auto}
.empty{color:var(--mut);text-align:center;padding:28px 10px}
.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;max-width:92vw}
.note:empty{display:none}
.inline{display:flex;gap:8px;align-items:center;margin:8px 0}
.inline input{flex:1}
.shr{margin-top:16px;background:#fff;color:var(--lavd)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--lav);border-radius:999px;padding:2px 2px 2px 2px;font-weight:500;padding-right:2px}
.chip button{min-height:36px;min-width:36px;padding:0;background:transparent;font-size:18px;border-radius:999px}
.chip .nm{padding:0 2px}
.chip-x{color:var(--mut)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 44px;gap:8px;align-items:center;margin:8px 0}
.x{min-width:44px;padding:0;background:var(--peach);color:var(--peachd);font-size:20px}
.plus{min-width:48px;padding:0;font-size:22px;background:var(--lavd);color:#fff}
.scan{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;margin:14px 0 0;border-radius:16px;background:var(--lavd);color:#fff;font-size:16px;font-weight:500;cursor:pointer}
.scanrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.scanrow .scan{margin-top:14px;padding:0 10px;text-align:center}
.scan.alt{background:var(--lav);color:var(--lavd)}
.galink{color:var(--lavd);text-decoration:underline;cursor:pointer;font-weight:500}
#camov{position:fixed;inset:0;z-index:99;background:#000;display:flex;flex-direction:column}
#camov video{flex:1;width:100%;min-height:0;object-fit:cover}
#camov .cam-msg{position:absolute;top:45%;width:100%;text-align:center;color:#fff}
.cam-bar{display:flex;align-items:center;justify-content:space-around;padding:18px 10px calc(18px + env(safe-area-inset-bottom));background:#000}
.cam-shot{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #9fd8b8;padding:0}
.cam-side{background:transparent;color:#fff;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px}.cam-side span{font-size:13px}
.scan.busy{opacity:.6;pointer-events:none}
.scan:focus-within{outline:3px solid #a9dcc0;outline-offset:2px}
.it{padding:10px 0}.it+.it{border-top:1px solid var(--line)}
.ith{display:flex;justify-content:space-between;gap:10px}.ith b{font-weight:500;white-space:nowrap}
.pch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pchip{min-height:36px;padding:0 10px;font-size:14px;background:var(--bg);color:var(--mut)}
.pchip.on{background:var(--lav);color:var(--ink);box-shadow:inset 0 0 0 2px var(--lavd)}
#e-items{margin-top:10px}
.bk{padding:6px 0}.bk+.bk{border-top:1px solid var(--line)}
.bkn{font-size:13px;color:var(--mut);margin-top:2px}
.curbtn{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:left;padding:0 12px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:400}
.curbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.curbtn::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translateY(-2px)}
label .curbtn{margin-top:6px}
.tr .curbtn{width:auto;min-width:7.5em}
.cpk{position:fixed;inset:0;z-index:20;background:rgb(36 53 45/.28);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.cpk-box{background:var(--bg);width:100%;max-width:520px;height:min(80vh,640px);border-radius:28px 28px 0 0;display:flex;flex-direction:column;padding:16px 16px 0}
@media(min-width:700px){.cpk{align-items:center}.cpk-box{border-radius:28px}}
.cpk-top{display:flex;gap:8px;align-items:center}
.cpk-top input{flex:1;border-radius:999px;padding-left:18px}
.cpk-list{overflow:auto;flex:1;margin-top:10px;padding-bottom:16px}
.cpk-h{font-size:13px;color:var(--mut);font-weight:500;margin:12px 4px 4px}
.cpi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border-radius:14px;padding:6px 10px;min-height:50px;font-weight:400}
.cpi .f{font-size:24px;flex:none}.cpi .c{font-weight:600;flex:none;width:3.2em}.cpi .n{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cpi.on{background:var(--lav)}.cpi:hover{background:#fff}
.mebox{margin-top:14px;background:rgb(255 255 255/.7);border-radius:16px;padding:12px 14px}
.mebox .chips{margin-top:8px}
.mebox .pchip{background:#fff}
.linkbtn{background:transparent;color:var(--lavd);padding:0 4px;min-height:32px;text-decoration:underline;font-weight:500}
.sharebox{margin-top:14px;color:var(--ink)}.sharebox ol{padding-left:20px;margin:6px 0}
.bar.me span:first-child,.tr.me .who{font-weight:700}
.tr.me{background:var(--lav);margin:0 -10px;padding:12px 10px;border-radius:14px}
.bkp{margin-top:10px;border-top:1px solid rgb(0 0 0/.08);padding-top:8px}.bkp .q{margin:10px 0 4px;font-weight:600;font-size:15px}.bkp .chips{margin-top:0}.bkp .curbtn{margin-top:2px}
.bkline{margin-top:6px;font-size:14px}
.h3row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.emos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.emo{min-height:44px;min-width:44px;padding:0;font-size:22px;background:var(--bg);border-radius:14px;flex:none}
#ng-emos .emosec,#g-emos .emosec{max-height:320px;overflow:auto;padding:2px 2px 8px;margin-top:8px}
.emosec .emos{margin:2px 0 6px}.emosec .cpk-h{margin:8px 2px 2px}
.emo.on{background:var(--lav);box-shadow:inset 0 0 0 2px var(--lavd)}
.emoin{width:7.5em;min-height:44px;flex:none;text-align:center;font-size:18px}
.ewrap{display:inline-flex;align-items:center;flex:none;gap:0}
.ein{width:48px;height:48px;min-height:48px;padding:0;text-align:center;font-size:24px;border-radius:15px;background:var(--lav);border:0;caret-color:transparent;cursor:pointer}
.ein:focus{box-shadow:inset 0 0 0 2px var(--lavd)}
.more{min-width:30px;width:30px;min-height:44px;padding:0;background:transparent;position:relative}
.more::after{content:"";position:absolute;left:10px;top:17px;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg)}
.emo.big{background:var(--lav);width:48px;height:48px}
.small{font-size:14px;color:var(--mut)}
h2.sec{font-size:21px;margin:30px 0 8px}
@media(max-width:600px){.prow{grid-template-columns:minmax(0,1fr) 7.2em 44px}.bar{grid-template-columns:5.5em minmax(0,1fr) auto}.row2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}.inline{flex-wrap:wrap}}
@media(prefers-reduced-motion:no-preference){.track i{transition:width .4s ease,left .4s ease}.modal:not([hidden]) .sheet{animation:up .25s ease}@keyframes up{from{transform:translateY(16px);opacity:0}}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button id="back" class="ghost" hidden>‹ Todos os grupos</button>
  <h1 id="title">Contas do grupo</h1>
  <p id="sub">Divide despesas, mesmo quando várias pessoas pagam a mesma conta.</p>
  <div id="hero"></div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="note" id="note" role="status"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {firebaseConfig} from "./config.js";
{
const DEF_RATES={EUR:1,USD:1.098,CRC:489.3,GBP:0.837,BRL:6.476};
const EXP=[['🍽️','jantar almoço almoco restaurante comida refeição refeicao pequeno-almoço'],['🛒','supermercado compras mercado'],['🏨','hotel alojamento airbnb hostel casa'],['⛽','gasolina combustível combustivel gasóleo'],['🚕','táxi taxi uber transporte autocarro'],['✈️','voo avião aviao'],['🚗','carro aluguer portagem estacionamento'],['🍺','cerveja bar copos bebidas'],['☕','café cafe pastelaria'],['🎟️','entrada bilhete bilhetes museu concerto tour'],['🏖️','praia'],['🎁','presente prenda'],['💡','luz água agua internet renda'],['💊','farmácia farmacia'],['🍦','gelado sobremesa'],['💸','']];
const GSEC=[['Viagens','✈️ 🏖️ ⛰️ 🏕️ 🗺️ 🧳 🚗 🚐 🚆 🚢 🏝️ 🌋 🏰 🏙️ 🗽'],['Casa','🏠 🏡 🏘️ 🏢 🛋️ 🛏️ 🔑 🧹 🧺 🪴 🛠️ 💡 🛒 🧾'],['Animais','🐶 🐱 🐰 🐹 🐠 🐦 🐢 🐴 🐄 🐷 🐑 🐔 🦊 🐻 🐼 🦁 🐘 🦒 🦋 🐬'],['Países','🇵🇹 🇧🇷 🇨🇷 🇪🇸 🇫🇷 🇮🇹 🇩🇪 🇬🇧 🇮🇪 🇳🇱 🇨🇭 🇬🇷 🇺🇸 🇨🇦 🇲🇽 🇦🇷 🇨🇱 🇨🇴 🇵🇪 🇵🇦 🇨🇺 🇦🇴 🇲🇿 🇨🇻 🇲🇦 🇿🇦 🇯🇵 🇹🇭 🇮🇳 🇦🇺 🇳🇿 🇹🇷'],['Comida e bebida','🍽️ 🍕 🍣 🍔 🌮 🍻 🍷 ☕ 🍰'],['Festas','🎂 🎉 🎄 🎃 💍 👶 🎓'],['Lazer e desporto','💼 💻 📚 🎵 🎸 🎮 🎬 🎨 ⚽ 🏀 🎾 🚴 🏄 ⛷️ 🏋️ 🧘'],['Outros','🌿 🌸 ☀️ ❄️ ❤️ 👨‍👩‍👧 👯 🤝 🏥 💸 ⭐ 🍀']].map(([t,l])=>[t,l.split(' ')]);
const GEMO=GSEC.flatMap(x=>x[1]);
const PEMO=['😀','😎','🤓','🥳','😺','🐶','🦊','🐼','🐸','🦁','🌸','🌵','⭐','🍀','🎈','🍕'];
const guess=t=>{const w=String(t||'').toLowerCase();for(const [e,k] of EXP)if(k&&k.split(' ').some(x=>w.includes(x)))return e;return '💸'};

const order=(g,rows)=>g.membros.map(p=>p.id).filter(k=>rows[k]&&rows[k].on);
function rebal(side){const g=G(),rows=edit[side],T=edit.total,on=order(g,rows);
  if(side==='div'&&edit.modo==='artigos'){const sh={};on.forEach(k=>sh[k]=0);
    (edit.itens||[]).forEach(it=>{const who=(it.who&&it.who.length?it.who:on).filter(k=>on.includes(k));if(!who.length)return;
      const b=Math.floor(it.v/who.length);let r=it.v-b*who.length;who.forEach(k=>{sh[k]+=b+(r>0?1:0);if(r>0)r--})});
    const S=on.reduce((a,k)=>a+sh[k],0);let acc=0;
    on.forEach(k=>{const v=S?Math.floor(T*sh[k]/S):Math.floor(T/on.length);rows[k].v=v;acc+=v});
    let r=T-acc;for(const k of on){if(r<=0)break;rows[k].v++;r--}return}
  if(side==='div'&&edit.modo==='partes'){const P=on.reduce((s,k)=>s+Math.max(0,+rows[k].p||0),0);let acc=0;
    on.forEach(k=>{const v=P?Math.floor(T*Math.max(0,+rows[k].p||0)/P):0;rows[k].v=v;acc+=v});let r=T-acc;
    for(const k of on){if(r<=0)break;if(+rows[k].p>0){rows[k].v++;r--}}return}
  const free=on.filter(k=>!rows[k].fix),fixed=on.filter(k=>rows[k].fix).reduce((s,k)=>s+rows[k].v,0);
  if(!free.length)return;const rest=T-fixed,base=Math.floor(rest/free.length);let r=rest-base*free.length;
  free.forEach(k=>{rows[k].v=base+(r>0?1:0);if(r>0)r--})}

/* aplica o nome, emoji e banco do perfil em todos os grupos onde estás */
function propagate(only){if(!prof)return;(only?[only]:mine).forEach(id=>{const g=groups[id],mid=meMap[id];if(!g||!mid)return;const p=g.membros.find(x=>x.id===mid);if(!p)return;let ch=false;
  if(prof.nome&&p.nome!==prof.nome){p.nome=prof.nome;ch=true}

  const nb=prof.banco?JSON.stringify(prof.banco):null,ob=p.banco?JSON.stringify(p.banco):null;
  if(nb!==ob){if(prof.banco)p.banco={...prof.banco};else delete p.banco;ch=true}
  if(ch)save(g)})}

    else if(d){prof={...prof,nome:d.nome,emoji:d.emoji,banco:d.banco,saiu:d.saiu||prof.saiu};const add=profMerge(d);if(add){cache();note(add===1?'Novo grupo adicionado.':add+' grupos novos adicionados.',3500)}}
    if(!edit)render()},e=>{note('Não consegui abrir o perfil ('+(e.code||'erro')+'). Vê as regras do Firestore.',7000)})})}

/* leitura de recibos: função no servidor (netlify/functions/recibo.mjs) */
const RECIBO='/.netlify/functions/recibo';
async function loadImg(f){try{return await createImageBitmap(f)}catch(e){}
  return await new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{ok(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};im.src=u})}
const fileB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
async function toJpeg(f){const img=await loadImg(f);const k=Math.min(1,1280/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',0.75).split(',')[1]}
(async()=>{try{if(gkey())return;const r=await fetch(RECIBO);if(!r.ok)return;const j=await r.json();if(!j.enabled)return;
  samp={json:async(_p,o)=>{let image;try{image=await toJpeg(o.images[0])}catch(e){throw {code:'image_rejected'}}
    const g=G();let r2;try{r2=await fetch(RECIBO,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image,moedas:g?Object.keys(g.taxas):[]})})}catch(e){throw {code:'upstream_error'}}
    if(!r2.ok)throw {code:r2.status===429?'rate_limited':r2.status===413?'image_rejected':'upstream_error'};return r2.json()}};
  canPhoto=true;if(edit&&!modal.hidden)drawEditor()}catch(e){}})();
/* leitura de recibos grátis: Gemini da Google com chave guardada no telemóvel */
const GK='contas-gemini';const CFG='app-config-leitura-ia';
if(fs)try{onSnapshot(doc(fs,'grupos',CFG),sn=>{const d=sn.exists()?sn.data():null;appKey=(d&&d.iaKey)||'';if(cur&&tab==='conf')render()},()=>{})}catch(e){}
function gkey(){let k='';try{k=localStorage.getItem('contas-gemini')||''}catch(e){}if(!k){const g=typeof G==='function'&&cur?G():null;k=(g&&g.iaKey)||''}return k||appKey}
let gErr='';const GMODELS=['gemini-flash-lite-latest','gemini-2.5-flash-lite','gemini-flash-latest','gemini-2.5-flash','gemini-2.0-flash'];let gModel={},noThink={};
/* fb=true: usa o projeto Firebase (Firebase AI Logic, Gemini Developer API grátis); fb=false: chave pessoal do Gemini */
async function gemCall(key,parts,json,fb){let last='upstream_error';const tag=fb?'fb':'k';
  for(const m of (gModel[tag]?[gModel[tag],...GMODELS.filter(x=>x!==gModel[tag])]:GMODELS)){let r;
    const url=fb?'https://firebasevertexai.googleapis.com/v1beta/projects/'+firebaseConfig.projectId+'/models/'+m+':generateContent'
               :'https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent';
    const h={'content-type':'application/json','x-goog-api-key':String(key||'').replace(/[^A-Za-z0-9._\-]/g,'')};if(fb)h['x-firebase-appid']=firebaseConfig.appId;
    const gc=json?{responseMimeType:'application/json',temperature:0}:{temperature:0};if(!noThink[m])gc.thinkingConfig={thinkingBudget:0};
    try{r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:gc})})}catch(e){gErr='rede/CORS: '+(e&&e.message||e);throw {code:'upstream_error'}}
    if(r.ok){gModel[tag]=m;const j=await r.json();return ((j.candidates||[])[0]?.content?.parts||[]).map(x=>x.text||'').join('')}
    const j=await r.json().catch(()=>({}));const msg=JSON.stringify(j);gErr=r.status+' '+m+': '+((j.error&&j.error.message)||msg).slice(0,160);
    if(r.status===400&&!/API_KEY|API key/i.test(msg)&&!noThink[m]){noThink[m]=1;return gemCall(key,parts,json,fb)}
    if(r.status===400&&!/API_KEY|API key/i.test(msg)){last='upstream_error';continue}
    if(r.status>=500){last='busy';continue}
    if(r.status===404||(r.status===429&&/limit: ?0\b/.test(msg))){last=r.status===429?'rate_limited':'upstream_error';continue}
    if(r.status===429)throw {code:'rate_limited'};
    if(/SERVICE_DISABLED|has not been used|is disabled|not enabled/i.test(msg))throw {code:'fb_off'};
    if(/API_KEY_INVALID|API key not valid/i.test(msg))throw {code:'bad_key'};
    if(/image|mime|inline/i.test(msg))throw {code:'image_rejected'};
    if(r.status===400&&/model/i.test(msg)){continue}
    throw {code:r.status===401||r.status===403?'bad_key':'upstream_error'}}
  throw {code:last}}
async function gemTest(k,fb){try{await gemCall(k,[{text:'Responde só: ok'}],false,fb);return true}catch(e){return e.code==='rate_limited'||e.code==='busy'}}
let fbAI=false,fbChk='a verificar…';
function mkSamp(){return {gem:true,json:async(prompt,o)=>{let image,mt='image/jpeg';try{image=await toJpeg(o.images[0])}catch(e){try{image=await fileB64(o.images[0]);mt=o.images[0].type||'image/heic'}catch(e2){throw {code:'image_rejected'}}}
    const parts=[{text:prompt},{inlineData:{mimeType:mt,data:image}}];let t;
    try{t=fbAI?await gemCall(firebaseConfig.apiKey,parts,true,true):await gemCall(gkey(),parts,true,false)}
    catch(e){if(fbAI&&gkey()&&e.code!=='image_rejected'){try{t=await gemCall(gkey(),parts,true,false)}catch(e2){throw e2.code==='bad_key'?{code:'gem_key'}:e2}}
      else throw e.code==='bad_key'&&!fbAI?{code:'gem_key'}:e}
    t=String(t||'').replace(/^```(?:json)?\s*|\s*```$/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');
    try{return JSON.parse(a>=0?t.slice(a,b+1):t)}catch(e){return {erro:'não percebi o recibo, tenta outra foto'}}}}}
function setupGem(){
  if(!fbAI&&!gkey()){if(samp&&samp.gem){samp=null;canPhoto=false}return}

let camStream=null;
function camClose(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const o=document.getElementById('camov');if(o)o.remove()}
function camPick(){const i=document.getElementById('camfile');if(i)i.click()}
async function camOpen(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){camPick();return}
  const ov=document.createElement('div');ov.id='camov';ov.innerHTML=`<video playsinline autoplay muted></video><p class="cam-msg">A abrir a câmara…</p>
  <div class="cam-bar"><button type="button" class="cam-side" data-cam="gal" aria-label="Escolher da galeria">🖼️<span>Galeria</span></button><button type="button" class="cam-shot" data-cam="shot" aria-label="Tirar foto"></button><button type="button" class="cam-side" data-cam="x" aria-label="Fechar">✕<span>Fechar</span></button></div>`;
  document.body.appendChild(ov);const v=ov.querySelector('video');
  ov.addEventListener('click',ev=>{const b=ev.target.closest('[data-cam]');if(!b)return;const a=b.dataset.cam;
    if(a==='x')camClose();
    else if(a==='gal'){camClose();camPick()}
    else if(a==='shot'&&v.videoWidth){const k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight)),cv=document.createElement('canvas');cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
      cv.toBlob(bl=>{camClose();if(bl)scan(new File([bl],'recibo.jpg',{type:'image/jpeg'}))},'image/jpeg',0.85)}});
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!document.getElementById('camov')){camClose();return}v.srcObject=camStream;ov.querySelector('.cam-msg').remove()}
  catch(e){camClose();camPick()}}
document.addEventListener('click',ev=>{if(ev.target.closest&&ev.target.closest('#camb')){ev.preventDefault();camOpen()}});
